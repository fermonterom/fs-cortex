name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck --severity=error hooks/observe.sh hooks/session-start.sh tests/*.sh install.sh uninstall.sh
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python lint
        run: pip install flake8 && flake8 hooks/*.py --max-line-length=120 --select=E9,F63,F7,F82

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.12']
        node-version: ['18', '22']
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run security tests
        run: bash tests/test_security.sh

      - name: Run dream cycle tests
        run: bash tests/test_dream_cycle.sh

      - name: Run observer tests
        run: bash tests/test_observe.sh

      - name: Run session learner tests
        run: bash tests/test_session_learner.sh

      - name: Run injector tests
        run: bash tests/test_injector.sh

      - name: Run YAML utils tests
        run: bash tests/test_yaml_utils.sh

      - name: Run install tests
        run: bash tests/test_install.sh

      - name: Run hooks e2e tests
        run: bash tests/test_hooks_e2e.sh

      - name: Test summary
        if: always()
        run: bash tests/run_all.sh 2>&1 | tail -10

  # Update test badge after all test jobs complete
  badge:
    needs: [test, test-windows]
    if: github.ref == 'refs/heads/main' && always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Count tests
        id: count
        run: |
          # Run tests ONCE and capture output
          OUTPUT=$(bash tests/run_all.sh 2>&1 || true)
          echo "$OUTPUT" | tail -5
          PASSED=$(echo "$OUTPUT" | grep 'Results:' | sed 's/.*: //' | sed 's/ passed.*//' | paste -sd+ - | bc)
          FAILED=$(echo "$OUTPUT" | grep 'Results:' | sed 's/.*, //' | sed 's/ failed.*//' | paste -sd+ - | bc)
          # Add PowerShell tests (can't run on Linux, known count)
          TOTAL=$((PASSED + FAILED + 9))
          if [ "$FAILED" -eq 0 ]; then
            echo "color=44cc11" >> "$GITHUB_OUTPUT"
            echo "status=${TOTAL} passing" >> "$GITHUB_OUTPUT"
          else
            echo "color=e05d44" >> "$GITHUB_OUTPUT"
            echo "status=$((PASSED + 9)) of ${TOTAL} passing" >> "$GITHUB_OUTPUT"
          fi

      - name: Update badge gist
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.BADGE_GIST_ID }}
          filename: fs-cortex-tests.json
          label: tests
          message: ${{ steps.count.outputs.status }}
          color: ${{ steps.count.outputs.color }}

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run PowerShell installer tests
        shell: pwsh
        run: pwsh tests/test_install_ps1.ps1
