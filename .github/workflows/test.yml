name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck --severity=error hooks/injector.sh tests/*.sh install.sh uninstall.sh
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python lint
        run: pip install flake8 && flake8 hooks/*.py hooks/lib/*.py --max-line-length=120 --select=E9,F63,F7,F82

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.13']
        node-version: ['22', '24']
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run security tests
        run: bash tests/test_security.sh

      - name: Run dream cycle tests
        run: bash tests/test_dream_cycle.sh

      - name: Run observer tests
        run: bash tests/test_observe.sh

      - name: Run session learner tests
        run: bash tests/test_session_learner.sh

      - name: Run injector tests
        run: bash tests/test_injector.sh

      - name: Run YAML utils tests
        run: bash tests/test_yaml_utils.sh

      - name: Run install tests
        run: bash tests/test_install.sh

      - name: Run hooks e2e tests
        run: bash tests/test_hooks_e2e.sh

      - name: Test summary
        if: always()
        run: bash tests/run_all.sh 2>&1 | tail -10

  # Update test badge after all test jobs complete
  badge:
    needs: [test, test-windows]
    if: github.ref == 'refs/heads/main' && always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Count tests
        id: count
        run: |
          # Run each suite individually and sum results
          TOTAL_PASS=0
          TOTAL_FAIL=0
          for test_file in tests/test_*.sh; do
            RESULT=$(bash "$test_file" 2>&1 || true)
            P=$(echo "$RESULT" | grep 'Results:' | sed 's/.*: //' | sed 's/ passed.*//')
            F=$(echo "$RESULT" | grep 'Results:' | sed 's/.*, //' | sed 's/ failed.*//')
            TOTAL_PASS=$((TOTAL_PASS + ${P:-0}))
            TOTAL_FAIL=$((TOTAL_FAIL + ${F:-0}))
            echo "  $(basename $test_file): ${P:-0} passed, ${F:-0} failed"
          done
          # Add PowerShell tests (can't run on Linux)
          TOTAL_PASS=$((TOTAL_PASS + 9))
          TOTAL=$((TOTAL_PASS + TOTAL_FAIL))
          echo "Total: $TOTAL_PASS passed, $TOTAL_FAIL failed (of $TOTAL)"
          if [ "$TOTAL_FAIL" -eq 0 ]; then
            echo "color=44cc11" >> "$GITHUB_OUTPUT"
            echo "status=${TOTAL} passing" >> "$GITHUB_OUTPUT"
          else
            echo "color=e05d44" >> "$GITHUB_OUTPUT"
            echo "status=$TOTAL_PASS of ${TOTAL} passing" >> "$GITHUB_OUTPUT"
          fi

      - name: Update badge gist
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.BADGE_GIST_ID }}
          filename: fs-cortex-tests.json
          label: tests
          message: ${{ steps.count.outputs.status }}
          color: ${{ steps.count.outputs.color }}

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run PowerShell installer tests
        shell: pwsh
        run: pwsh tests/test_install_ps1.ps1
