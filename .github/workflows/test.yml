name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck hooks/*.sh tests/*.sh install.sh || true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python lint
        run: pip install flake8 && flake8 hooks/*.py --max-line-length=120 --ignore=E501,W503 || true

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.12']
        node-version: ['18', '22']
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run security tests
        run: bash tests/test_security.sh

      - name: Run dream cycle tests
        run: bash tests/test_dream_cycle.sh

      - name: Run observer tests
        run: bash tests/test_observe.sh

      - name: Run session learner tests
        run: bash tests/test_session_learner.sh

      - name: Run injector tests
        run: bash tests/test_injector.sh

      - name: Run YAML utils tests
        run: bash tests/test_yaml_utils.sh

      - name: Run install tests
        run: bash tests/test_install.sh

      - name: Run hooks e2e tests
        run: bash tests/test_hooks_e2e.sh
